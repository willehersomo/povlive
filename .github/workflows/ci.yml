name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar POV-Ray e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            povray python3-pyqt5 python3-pil python3-numpy python3-pytest \
            fakeroot dpkg-dev fonts-dejavu-core

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m pytest -q

      - name: Gerar o .deb
        run: |
          mkdir -p dist
          ./empacotamento/empacotar.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: povlive-deb
          path: dist/*.deb

  release:
    needs: testes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: povlive-deb
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
