name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar POV-Ray e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            povray povray-includes python3-pyqt5 python3-pil python3-numpy python3-pytest python3-pytest-cov \
            python3-opengl libgl1-mesa-dri libegl1 \
            fakeroot dpkg-dev fonts-dejavu-core

      - name: Ruff
        run: pipx run ruff check .

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m pytest -q --cov=povlive_app --cov-report=term --cov-fail-under=70

      - name: Gerar o .deb
        run: |
          mkdir -p dist
          ./empacotamento/empacotar.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: povlive-deb
          path: dist/*.deb

  appimage:
    needs: testes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependências para compilar o POV-Ray
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make autoconf automake patchelf libfuse2 \
            libboost-thread-dev libboost-system-dev libboost-date-time-dev \
            libpng-dev libjpeg-dev libtiff-dev zlib1g-dev \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Montar o AppImage
        run: ./empacotamento/appimage/montar.sh dist
      - name: Autoteste do AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          POVLIVE_AUTOTESTE_LOG: ${{ github.workspace }}/autoteste.txt
        run: |
          ./dist/PovLive-*-x86_64.AppImage --appimage-extract-and-run --autoteste
          cat autoteste.txt
      - uses: actions/upload-artifact@v7
        with:
          name: povlive-appimage
          path: dist/*.AppImage

  release:
    needs: [testes, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: povlive-deb
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: povlive-appimage
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
